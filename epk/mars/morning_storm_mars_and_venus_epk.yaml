    bio: |-
      Morning Storm é um power trio de stoner / sludge metal de Blumenau,
      Santa Catarina. A banda foi formada em 2015, mas suas raízes vêm de muito
      antes: os integrantes carregam décadas de estrada. Rian Rau, responsável
      por guitarra e vocal, toca ao vivo desde o fim dos anos 80; Je Faver é
      baixista e professor de música; e Brian de Freitas é o baterista cuja
      passagem por diversas bandas o tornou um dos nomes mais requisitados da
      cena regional.

      Morning Storm bebe direto da época em que os gêneros começaram a se
      misturar nos anos 1990: stoner / sludge metal na essência, com uma boa
      dose de grunge e alt metal, alternando entre passagens introspectivas e
      explosões de peso, com thrash e hardcore também correndo nas veias. As
      letras vão do psicológico e introspectivo (“Dark Side”, “Masks”) à crítica
      social afiada (“Fight for Your Life”, “Ghost Town”, a última escrita sobre
      a população em situação de rua), e seguem abrindo novos caminhos.

      Depois do EP “Dark Side” (2021) e de uma sequência constante de singles e
      shows, 2026 é o maior ano da história da banda. Um novo EP está em produção,
      enquanto o single e clipe “Mars and Venus” chegam em 1º de setembro de 2026
      para apresentar a nova formação e a nova fase da Morning Storm. Em outubro,
      a banda abre para o RODOX em Blumenau. No início de 2027, a Morning Storm
      cruza o Atlântico para sua primeira turnê europeia. O roteiro está em
      construção e há datas em aberto.

