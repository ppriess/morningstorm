  lyric_theme:
    title: "Sobre a letra"
    text: |-
      A letra de “Mars and Venus” fala sobre como nós, seres humanos, por vezes
      caminhamos perdidos, movidos pela soberba, pelo desejo e pela força da
      atração. A música aborda também a dinâmica entre homens e mulheres, os
      conflitos que surgem dentro dos relacionamentos e a disputa por poder que
      pode existir entre duas pessoas.

      Essas ideias aparecem por meio de metáforas e imagens ligadas aos astros,
      à alquimia e a referências de culturas antigas, criando uma linguagem
      simbólica para falar de desejo, união, confronto e domínio.

